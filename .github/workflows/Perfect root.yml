
name: Build Perfect Root Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        # Switching to the latest main branch which should have the fix
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://android.googlesource.com/kernel/common
          kernel-branch: android15-6.6
          config: gki_defconfig
          arch: arm64
          android-version: 15
          
          # Use the built-in ksun-next toggle
          ksu: true
          ksu-next: true
          
          # SUSFS Integration
          rekernel: true 
          
          # Modern artifact uploader compatibility
          anykernel3: true 
