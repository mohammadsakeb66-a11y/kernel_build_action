name: Build Perfect Root Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        # Switching to a specific stable version to avoid @main bugs
        uses: dabao1955/kernel_build_action@v1.1
        with:
          kernel-url: https://android.googlesource.com/kernel/common
          # Using the most reliable GKI branch name
          kernel-branch: android15-6.6
          config: gki_defconfig
          arch: arm64
          android-version: 15
          
          # Simplified KSU-Next setup
          ksu: true
          ksu-next: true
          
          # SUSFS Integration
          rekernel: true 
          
          # Flashable package
          anykernel3: true 
