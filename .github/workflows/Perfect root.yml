name: Build Perfect Root Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://android.googlesource.com/kernel/common
          kernel-branch: android15-6.6
          config: gki_defconfig
          arch: arm64
          android-version: 15
          
          # KernelSU-Next (ksun) Integration
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/rifsxd/KernelSU-Next
          ksu-version: main
          
          # SUSFS Integration
          rekernel: true 
          
          # Output format
          anykernel3: true 
